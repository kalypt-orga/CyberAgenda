[versions]
agp = "9.5.2"
kotlin = "2.4.21"
ksp = "2.3.14"
hilt = "2.60.1"
room = "2.8.5"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
lifecycle = "2.11.1"
coreKtx = "1.19.1"
navigation = "2.10.2"
